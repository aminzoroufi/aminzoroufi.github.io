<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f7fb" />
    <meta name="description" content="RelayMeet — private browser meetings with host-controlled entry." />
    <title>RelayMeet</title>
    <style>
      html, body, iframe {
        height: 100%;
        margin: 0;
        width: 100%;
      }
      body {
        background: #f4f7fb;
        overflow: hidden;
      }
      iframe {
        border: 0;
        display: block;
      }
      noscript {
        align-items: center;
        color: #16213a;
        display: flex;
        font: 16px/1.5 system-ui, sans-serif;
        inset: 0;
        justify-content: center;
        position: fixed;
      }
    </style>
  </head>
  <body>
    <iframe
      id="relaymeet-app"
      title="RelayMeet application"
      allow="autoplay; camera; microphone; display-capture; clipboard-read; clipboard-write"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
    <noscript>RelayMeet requires JavaScript to start a secure browser meeting.</noscript>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var joinId = params.get("join");
        var roomId = params.get("room");
        var validJoinId = joinId && /^rm_[A-Za-z0-9_-]+$/.test(joinId);
        var validRoomId = roomId && /^rm_[A-Za-z0-9_-]+$/.test(roomId);
        var role = params.get("role") === "guest" ? "guest" : "host";
        var path = validRoomId
          ? "/room/" + encodeURIComponent(roomId)
          : validJoinId
            ? "/join/" + encodeURIComponent(joinId)
            : "/";
        var upstreamOrigin = "https://relaymeet-gateway.vercel.app";
        var upstream = new URL(path, upstreamOrigin);
        upstream.searchParams.set("relaymeetShell", "github");
        if (validRoomId) upstream.searchParams.set("role", role);
        if (validJoinId && params.get("mode") === "demo") upstream.searchParams.set("mode", "demo");

        var frame = document.getElementById("relaymeet-app");
        frame.src = upstream.toString();

        window.addEventListener("message", function (event) {
          if (event.origin !== upstreamOrigin || event.source !== frame.contentWindow) return;
          var message = event.data;
          if (!message || message.source !== "relaymeet") return;

          if (message.type === "home-route") {
            history.replaceState(null, "", window.location.pathname);
            return;
          }

          var nextRoomId = message.roomId;
          var nextRole = message.role;
          if (
            message.type !== "room-route" ||
            !/^rm_[A-Za-z0-9_-]+$/.test(nextRoomId) ||
            (nextRole !== "host" && nextRole !== "guest")
          ) return;

          var visibleUrl = new URL(window.location.href);
          visibleUrl.search = "";
          visibleUrl.hash = "";
          visibleUrl.searchParams.set("room", nextRoomId);
          visibleUrl.searchParams.set("role", nextRole);
          history.replaceState(null, "", visibleUrl.pathname + visibleUrl.search);
        });
      }());
    </script>
  </body>
</html>
