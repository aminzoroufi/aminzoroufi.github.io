<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f7fb" />
    <meta name="description" content="RelayMeet — private browser meetings with host-controlled entry." />
    <title>RelayMeet</title>
    <style>
      html, body, iframe {
        height: 100%;
        margin: 0;
        width: 100%;
      }
      body {
        background: #f4f7fb;
        overflow: hidden;
      }
      iframe {
        border: 0;
        display: block;
      }
      noscript {
        align-items: center;
        color: #16213a;
        display: flex;
        font: 16px/1.5 system-ui, sans-serif;
        inset: 0;
        justify-content: center;
        position: fixed;
      }
    </style>
  </head>
  <body>
    <iframe
      id="relaymeet-app"
      title="RelayMeet application"
      allow="autoplay; camera; microphone; display-capture; clipboard-read; clipboard-write"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
    <noscript><a href="https://relaymeet.web.app/">Open RelayMeet</a></noscript>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var roomId = params.get("join");
        var validRoomId = roomId && /^rm_[A-Za-z0-9_-]+$/.test(roomId);
        var path = validRoomId ? "/join/" + encodeURIComponent(roomId) : "/";
        var upstream = new URL(path, "https://relaymeet.web.app");
        upstream.searchParams.set("relaymeetShell", "github");
        if (validRoomId && params.get("mode") === "demo") {
          upstream.searchParams.set("mode", "demo");
        }
        document.getElementById("relaymeet-app").src = upstream.toString();
      }());
    </script>
  </body>
</html>
